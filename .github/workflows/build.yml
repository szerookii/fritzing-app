name: Build Fritzing App and Upload Artifacts

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Qt (Windows)
        if: matrix.os == 'windows-latest'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'windows'
          arch: 'win64_msvc2019_64'

      - name: Set up Qt (macOS)
        if: matrix.os == 'macos-latest'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.5.3'
          host: 'mac'
          arch: 'clang_64'

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install -y git cmake

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake

      - name: Build libgit2 (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          git clone --branch v1.7.1 --depth 1 https://github.com/libgit2/libgit2.git libgit2-1.7.1
          cd libgit2-1.7.1
          mkdir build64
          cd build64
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DBUILD_CLAR=OFF
          cmake --build . --config Release
          cd ..
          mkdir Release
          copy build64\Release\git2.lib Release\
          copy include\git2.h include\git2_global.h ..\include\
        shell: cmd

      - name: Build libgit2 (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          git clone --branch v1.7.1 --depth 1 https://github.com/libgit2/libgit2.git libgit2-1.7.1
          cd libgit2-1.7.1
          mkdir build
          cd build
          cmake .. -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release -DBUILD_CLAR=OFF
          cmake --build . --config Release
          cd ..
          mkdir -p lib
          cp build/libgit2.a lib/
          cp -r include ../include
        shell: bash

      - name: Build Fritzing (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          qmake
          cmake --build . --config Release
        shell: cmd

      - name: Build Fritzing (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          qmake
          cmake --build . --config Release
        shell: bash

      - name: Find build artifact (Windows)
        if: matrix.os == 'windows-latest'
        id: artifact-win
        run: |
          echo "artifact_path=$(Get-ChildItem -Path . -Filter fritzing.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName)" >> $env:GITHUB_ENV
        shell: powershell

      - name: Find build artifact (macOS)
        if: matrix.os == 'macos-latest'
        id: artifact-mac
        run: |
          echo "artifact_path=$(find . -type d -name 'Fritzing.app' | head -n 1)" >> $GITHUB_ENV
        shell: bash

      - name: Upload artifact (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fritzing-windows
          path: ${{ env.artifact_path }}

      - name: Upload artifact (macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: fritzing-macos
          path: ${{ env.artifact_path }}
